name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install client dependencies
        run: npm install
        working-directory: client
      - name: Lint client
        run: npm run lint
        working-directory: client
      - name: Install server dependencies
        run: npm install
        working-directory: server
      - name: Format check server
        run: npx biome format --check src/
        working-directory: server

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test client
        run: |
          npm install
          npm test
        working-directory: client
      - name: Test server
        run: |
          npm install
          npm test
        working-directory: server

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build client
        run: |
          npm install
          npm run build
        working-directory: client
      - name: Build server
        run: |
          npm install
          npm run build
        working-directory: server
